<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Short Description of IUGA" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <title>IUGA UW</title>
    <!-- The theme, set before the first paint so the page never flashes the wrong one.
         A remembered choice wins; otherwise the system setting. Keep in step with src/utils/theme.js. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("iuga-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      @font-face { font-family: "Rubik"; src: url("/font/Rubik-VariableFont_wght.ttf") format("truetype"); font-weight: 300 900; font-style: normal; }
      @font-face { font-family: "Rubik"; src: url("/font/Rubik-Italic-VariableFont_wght.ttf") format("truetype"); font-weight: 300 900; font-style: italic; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
